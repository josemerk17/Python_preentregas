{% extends 'posts/base.html' %}

{% block content %}
    <h2>Iniciar sesión</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Entrar</button>
    </form>
    <p><a href="{% url 'accounts:registro' %}">Crear una cuenta</a></p>
{% endblock %}
